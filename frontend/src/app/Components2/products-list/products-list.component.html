<app-header></app-header>

<!-- <app-quickview 
    [isVisible]="showQuickView" 
    [selectedProduct]="selectedProduct" 
    (closeModalEvent)="closeQuickView()">
</app-quickview> -->

<div class="container-fluid">
    <div class="row">

        <div class="col-md-4 col-lg-3">
            <aside class="sidebar pt-4 bg-light">
                <p class="filterHeader">Filter by</p>
                <hr>

                <div class="mb-3">
                    <label class="form-label">Categories</label>
                    <div *ngIf="categories && categories.length > 0">
                        <div *ngFor="let category of categories" class="form-check">
                            <input class="form-check-input" type="radio" name="category" [value]="category._id"
                                   (change)="onCategoryChange(category._id)" [id]="'category' + category._id"
                                   [checked]="selectedCategoryId === category._id">
                            <label class="form-check-label" [for]="'category' + category._id">
                              {{ category.Cname }}
                            </label>
                        </div>
                    </div>
                    <div *ngIf="!categories || categories.length === 0">
                        <p>No categories available</p>
                    </div>
                    <hr>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Brands</label>
                    <div *ngIf="brands && brands.length > 0">
                        <div *ngFor="let brand of brands" class="form-check">
                            <input class="form-check-input" type="radio" name="brand" [value]="brand._id"
                                   (change)="onBrandChange(brand._id)" [id]="'brand' + brand._id"
                                   [checked]="selectedBrandId === brand._id">
                            <label class="form-check-label" [for]="'brand' + brand._id">
                              {{ brand.Bname }}
                            </label>
                        </div>
                    </div>
                    <div *ngIf="!brands || brands.length === 0">
                        <p>No brands available</p>
                    </div>
                    <hr>
                </div>
      
                <button class="btn filter-btn" type="button" (click)="resetFilters()">Reset Filters</button>
            </aside>
        </div>

        <div class="col-md-8 col-lg-9">
            <div class="row mb-4">
                <div class="col-md-6 position-relative">
                    <form (submit)="onSearch($event)">
                        <div class="input-group">
                            <input 
                                type="text" 
                                class="form-control searchBar" 
                                placeholder="Search products..." 
                                [(ngModel)]="searchQuery" 
                                name="searchQuery">
                            <button type="submit" class="btn btn-outline-secondary">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </form>
                </div>
                <div class="col-md-6">
                    <select class="form-control custom-select" (change)="onSortChange($event)">
                        <option value="" disabled selected hidden>Sort</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                    </select>
                </div>
            </div>

            <div class="row productRow">
                <div *ngFor="let product of products" class="product-card col-md-4 mb-4" [routerLink]="['/LandingPage/Product', product._id]" style="cursor: pointer;">
                    <div class="image-container position-relative">
                        <img [src]="product.imgUrl" class="card-img-top product-img" alt="{{ product.name }}">
                        <div class="overlay-icons">
                            <a class="product-item product-link product-icon" href="#" (click)="$event.stopPropagation()"><i class="fas fa-heart"></i></a>
                            <a class="product-item product-link product-icon" (click)="openQuickView(product); $event.stopPropagation()"><i class="fas fa-eye"></i></a>
                        </div>
                    </div>
                    <div class="img-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-price">{{ product.price }} le</p>
                        <p class="card-seller">Sold by: {{ product.sellerCompanyName }}</p>
                        <button [disabled]="product.shallowStock == 0" class="btn add-to-cart-btn" (click)="$event.stopPropagation(); increase(product)">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div *ngIf="products.length > 0" class="pagination-controls text-center my-4">
    <button class="btn btn-light" (click)="previousPage()" [disabled]="currentPage === 1">
        <i class='bx bx-chevron-left' style="font-size: 1.7em;"></i>
    </button>
    <div *ngFor="let page of pagesArray" class="d-inline-block mx-1">
        <button class="btn btn-light" (click)="selectedPage(page)" [disabled]="currentPage === page">{{ page }}</button>
    </div>
    <button class="btn btn-light" (click)="nextPage()" [disabled]="currentPage === totalPages">
        <i class='bx bx-chevron-right' style="font-size: 1.7em;"></i>
    </button>
</div>

<app-footer></app-footer>
