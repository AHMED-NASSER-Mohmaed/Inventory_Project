<app-header></app-header>

<app-quickview 
    [isVisible]="showQuickView" 
    [selectedProduct]="selectedProduct" 
    (closeModalEvent)="closeQuickView()">
</app-quickview>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-4 col-lg-3">
      <aside class="sidebar pt-4 bg-light">
        <p  class="filterHeader">Filter by</p>
        <hr>
        <!-- Gender  -->
        <div class="mb-3">
            <label class="form-label">Gender</label>
            <div *ngFor="let activeCategory of activeCategory" class="form-check">
                <input class="form-check-input" type="radio" name="gender" [value]="activeCategory._id"
                       (change)="onCategoryChange(activeCategory._id)" id="gender{{activeCategory._id}}">
                <label class="form-check-label" for="gender{{activeCategory._id}}">
                  {{activeCategory.name}}
                </label>
              </div>
            <hr>
        </div>
        
        <!-- Brand  -->
         @if (selectedCategoryId!==null) {
            <div class="mb-3 brands">
                <label class="form-label">Brands</label>
                <div *ngFor="let brand of brandsByCategory" class="form-check">
             <input class="form-check-input" type="radio" name="brand" [value]="brand._id"
                    (change)="onBrandChange(brand._id)" id={{brand._id}}>
                 <label class="form-check-label" for={{brand._id}}>
                  {{brand.name}}
              </label>
</div>
            </div>
         }
      
        <!-- Filter Buttons -->
        <button class="btn filter-btn" type="button" (click)="resetFilters()">Reset Filters</button>
    </aside>
</div>

        <!-- Page Content  -->

            <div class="col-md-8 col-lg-9 ">
                <!-- Search Bar and Sort Dropdown -->
        <div *ngIf="products.length > 0" class="row mb-4 SInputs">
          <div class="col-md-6 position-relative">
        <input type="text" class="form-control searchBar" placeholder="Search products...">
        <i class="fas fa-search search-icon"></i> 
            </div>
         <div class="col-md-6">
                  <select class="form-control custom-select" (change)="onSortChange($event)">
                        <option value="" disabled selected hidden>Sort</option>
                        <option value="price_asc">Price: Low to High</option>
                         <option value="price_desc">Price: High to Low</option>
                      </select>
                 </div>
            </div>




                <div class="row productRow">
                    @if(products.length==0){
                        <p class="text-danger">Sorry ! No products available</p>
                    }@else{
                        <div *ngFor="let product of products" class="product-card ">
                            <div class="image-container position-relative">
                                <img [src]="product.images[0].url" class="card-img-top product-img" alt="...">
                                <div class="overlay-icons">
                                    <a class="product-item product-link product-icon" href="#"><i class="fas fa-heart"></i></a>
                                    <a class="product-item product-link product-icon" (click)="openQuickView(product)"><i class="fas fa-eye"></i></a>
                                </div>
                            </div>
                            <div class="img-body">
                                <h5 class="card-title">{{product.name}}</h5>
                                <p class="card-price">{{product.price}} le</p>
                                <p class="card-seller">Sold by: {{product.sellerName}}</p>
                                <button class="btn add-to-cart-btn">Add to Cart</button>
                            </div>
                        </div>
                    }
                </div>
        </div>
    </div>
</div>

<div *ngIf="products.length > 0" class="pagination-controls">
    <button (click)="previousPage()" [disabled]="currentPage === 1"><i class='bx bx-chevron-left' style="font-size: 1.7em;"></i></button>
    <div *ngFor="let page of pagesArray"><button  (click)="selectedPage(page)" [disabled]="currentPage === page">{{page}}</button></div>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages"><i class='bx bx-chevron-right' style="font-size: 1.7em;"></i></button>
</div>


<app-footer></app-footer>
