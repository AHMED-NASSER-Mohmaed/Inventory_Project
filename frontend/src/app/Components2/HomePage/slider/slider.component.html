            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
        </div>
        <div class="carousel-inner">

                </div>
            </div>
            <div class="carousel-item special-opacity">
                <img src="assets/home.png" class="d-block w-100" alt="Home slide">

                    <p class="carousel-caption2">Coming soon...</p>
                    <button class="btn Explorebtn" [routerLink]="['/products']">Explore more</button>
                </div>
            </div>
        </div>
    
    </div>
