<div class="slider-container">
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="image-overlay"></div>
                <img src="assets/watch4.jpg" class="d-block w-100" alt="Home slide">
                <div class="carousel-caption animate__animated animate__fadeInUp">
                    <p class="carousel-caption1">Enchanted Watches</p>
                    <p class="carousel-caption2">Experience Expensive Watches</p>
                    <button class="Explorebtn" [routerLink]="['/products']">Explore more</button>
                </div>
            </div>
            <div class="carousel-item">
                <div class="image-overlay"></div>
                <img src="assets/watch2.jpeg" class="d-block w-100" alt="Home slide">
                <div class="carousel-caption animate__animated animate__fadeInUp">
                    <p class="carousel-caption1">Exotic Collection</p>
                    <p class="carousel-caption2">Rare Watches & Good Quality</p>
                    <button class="Explorebtn" [routerLink]="['/products']">Explore more</button>
                </div>
            </div>
            <div class="carousel-item">
                <div class="image-overlay"></div>
                <img src="assets/watch1.jpg" class="d-block w-100" alt="Home slide">
                <div class="carousel-caption animate__animated animate__fadeInUp">
                    <p class="carousel-caption1">Time Essentials</p>
                    <p class="carousel-caption2">Premium Leather & Accessories</p>
                    <button class="Explorebtn" [routerLink]="['/products']">Explore more</button>
                </div>
            </div>
        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
</div>
