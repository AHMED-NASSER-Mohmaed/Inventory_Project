<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

<div class="mt-5 container text-center">
    <p style="font-family: 'Baskerville Serial', serif;" class="fs-1 fw-medium">Featured products</p>
    <p class="featuredProducts" style="margin-bottom: 50px;" >
        We are happy to introduce the new Lawson Collection. These are three quartz models <br>
        designed with simplicity and elegance kept in mind.
    </p>
</div>

<div class="container">
    <div class="row">

      <div *ngFor="let product of products" class="col" [routerLink]="['/LandingPage/Product', product._id]" style="cursor: pointer;">
            <div class="image-container ">
              <img [src]="product.imgUrl" class="card-img-top product-img" alt="{{ product.name }}">
              <div class="overlay-icons">
                <a class="product-item product-link product-icon" href="#" (click)="$event.stopPropagation()"><i class="fas fa-heart"></i></a>
                <a class="product-item product-link product-icon" (click)="openQuickView(product); $event.stopPropagation()"><i class="fas fa-eye"></i></a>
              </div>
              @if(product.shallowStock <= 0){
                <div class="m-auto text-center mt-3">

                    <span class="text-danger">Product Out of Stock!</span>
                </div>
              }
              <button class="btn add-to-cart-btn" [disabled]="product.shallowStock <= 0 || token.id.userType != 'customer'" (click)="$event.stopPropagation(); increase(product)">Add to Cart</button>
            </div>
            <div class="img-body">
              <h5 class="card-title">{{ product.name }}</h5>
              <p class="card-price">{{ product.price }} le</p>
              <p class="card-seller">Sold by: {{ product.sellerCompanyName }}</p>
            </div>
          </div>
    </div>
</div>


<div class="button-container">
  <button class="Collectionbtn" [routerLink]="['/products']">Shop New Collection</button>
</div>

<app-quickview 
    [isVisible]="showQuickView" 
    [selectedProduct]="selectedProduct" 
    (closeModalEvent)="closeQuickView()">
</app-quickview>
