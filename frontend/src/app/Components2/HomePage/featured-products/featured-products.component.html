
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">


<div  class=" mt-5  container text-center ">
    <p  style="font-family: 'Baskerville Serial', serif;"  class="fs-1 fw-medium">Featured products</p>
    <p class="featuredProducts" >
        We are happy to introduce the new Lawson Collection. These are three quartz models <br>
    designed with simplicity and elegance kept in mind  </p>
</div>

 <div class="container">
    <div class="row">
        <div class="col">
            <div class="image-container  position-relative">
                <img src="assets/12-300x300.png" class="card-img-top product-img" alt="...">

                <div class="overlay-icons">
                    <a class="product-item product-link product-icon" href="#"><i class="fas fa-heart"></i></a>
                    <a class="product-item product-link product-icon" href="#"><i class="fas fa-eye"></i></a>
                </div>
                
                <button class="btn add-to-cart-btn">Add to Cart</button>
            </div>
            <div class="img-body">
                <!-- <h5 class="card-title">{{product.name}}</h5>
                <p class="card-price">{{product.price}}</p>
                <p class="card-seller">Sold by: {{product.sellerName}}</p> -->
            </div>
        </div>

        <div class="col">
            <div class="image-container">
                <img src="assets/11-300x300.png" class="card-img-top product-img" alt="...">


                <div class="overlay-icons">
                    <a class="product-item product-link product-icon" href="#"><i class="fas fa-heart"></i></a>
                    <a class="product-item product-link product-icon" (click)="openQuickView(product)"><i class="fas fa-eye"></i></a>                </div>


                <button class="btn  add-to-cart-btn">Add to Cart</button>
            </div>

            <app-quickview 
            [isVisible]="showQuickView" 
            [selectedProduct]="selectedProduct" 
            (closeModalEvent)="closeQuickView()">
          </app-quickview>

            </div> -->
        </div>
