<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

<div class="section-header">
    <div class="decorative-line"></div>
    <h2 class="section-title">New Arrival</h2>
    <p class="section-description">
        Discover our latest arrivals - fresh styles and trending pieces just added to our collection.<br>
        Shop the newest fashion must-haves!
    </p>
    <div class="decorative-line"></div>
</div>

<div class="container products-container">
    <div class="row product-row justify-content-center">
        <!-- Loop through NewArrival -->
        <div *ngFor="let product of products" class="col-xl-3 col-lg-4 col-md-6 col-sm-6 product-col" [routerLink]="['/LandingPage/Product', product._id]">
            <div class="product-card">
                <div class="image-container">
                    <img [src]="product.imgUrl" class="product-img" alt="{{ product.name }}">
                    <div class="overlay-icons">
                        <a class="product-icon" (click)="openQuickView(product); $event.stopPropagation()">
                            <i class="fas fa-eye"></i>
                        </a>
                    </div>
                    @if(product.shallowStock <= 0){
                        <div class="stock-badge">
                            <span>Out of Stock</span>
                        </div>
                    }
                    <button class="btn add-to-cart-btn" [disabled]="product.shallowStock <= 0 ||  (token && token.id.userType != 'customer')" (click)="$event.stopPropagation(); increase(product)">
                        <i class="fas fa-shopping-cart"></i> Add to Cart
                    </button>
                </div>
                <div class="product-info">
                    <h5 class="product-title">{{ product.name }}</h5>
                    <p class="product-price">{{ product.price | currency }}</p>
                    <p class="product-seller">Sold by: {{ product.sellerCompanyName }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Quick View Modal -->
<app-quickview 
    [isVisible]="showQuickView" 
    [selectedProduct]="selectedProduct" 
    (closeModalEvent)="closeQuickView()">
</app-quickview>
