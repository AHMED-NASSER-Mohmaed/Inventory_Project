<div class="parent3">
    <section id="sidebar">
        <a href="#" class="brand">
            <i class='bx bxs-watch'></i>
            <span class="text">Watchly</span>
        </a>
        <ul class="side-menu top">
            <!-- Users menu with dropdown -->
            
            <li routerLinkActive="active" (click)="toggleDropdown('products')">
                <a href="javascript:void(0)">
                    <i class='bx bxs-shopping-bag-alt'></i>
                    <span class="text">Products</span>
                    <i class='bx bx-chevron-down dropdown-icon' [class.rotate]="isDropdownOpen('products')"></i>
                </a>
                <ul class="dropdown-menu" [class.show]="isDropdownOpen('products')">
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer">
                      <a routerLink="/Sdashboard/products" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                        <i class='bx bxs-collection' style="font-size: 1.5em;"></i>
                        <span class="text" style="font-size: 0.9em;">Browse My Products</span>
                      </a>
                    </li>
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer;">
                      <a routerLink="/Sdashboard/sell-new-products" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                        <i class='bx bxs-plus-circle' style="font-size: 1.5em;"></i>
                        <span class="text" style="font-size: 0.9em;">Sell New Product</span>
                      </a>
                    </li>
                </ul>
            </li>
            <li routerLinkActive="active" (click)="toggleDropdown('users')">
                <a href="javascript:void(0)">
                    <i class='bx bxs-package'></i>
                    <span class="text">Orders</span>
                    <i class='bx bx-chevron-down dropdown-icon' [class.rotate]="isDropdownOpen('users')"></i>
                </a>
                <ul class="dropdown-menu" [class.show]="isDropdownOpen('users')">
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer">
                      <a routerLink="/Sdashboard/seller-pending-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                        <i class='bx bxs-hourglass' style="font-size: 1.5em;"></i>
                        <span class="text" style="font-size: 0.9em;">Pending</span>
                      </a>
                    </li>
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer;">
                      <a routerLink="/Sdashboard/seller-processing-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                        <i class='bx bxs-cog' style="font-size: 1.5em;"></i>
                        <span class="text" style="font-size: 0.9em;">Processing</span>
                      </a>
                    </li>
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer;">
                        <a routerLink="/Sdashboard/seller-shipped-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                          <i class='bx bxs-truck' style="font-size: 1.5em;"></i>
                          <span class="text" style="font-size: 0.9em;">Shipped</span>
                        </a>
                    </li>
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer;">
                        <a routerLink="/Sdashboard/seller-delivered-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                          <i class='bx bxs-check-circle' style="font-size: 1.5em;"></i>
                          <span class="text" style="font-size: 0.9em;">Delivered</span>
                        </a>
                    </li>
                    <li style="text-align: center; padding: 5px 0; width: 96%; cursor: pointer;">
                        <a routerLink="/Sdashboard/seller-cancelled-orders" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                          <i class='bx bxs-x-circle' style="font-size: 1.5em;"></i>
                          <span class="text" style="font-size: 0.9em;">Cancelled</span>
                        </a>
                    </li>
                  </ul>
            </li>

            <li routerLinkActive="active">
                <a routerLink="/Adashboard/orders" style="cursor: pointer">
                    <i class='bx bxs-star-half'></i>
                    <span class="text">Reviews</span>
                </a>
            </li>

            <!-- Analytics menu -->
            <li routerLinkActive="active">
                <a routerLink="/dashboard/analytics" style="cursor: pointer">
                    <i class='bx bxs-doughnut-chart'></i>
                    <span class="text">Analytics</span>
                </a>
            </li>
        </ul>
        <ul class="side-menu">
            <li>
                <a class="logout" style="cursor: pointer" (click)="openConfirmDialog()">
                    <i class='bx bx-log-out-circle'></i>
                    <span class="text">Logout</span>
                </a>
                
            </li>
        </ul>
    </section>
    <!-- SIDEBAR -->
    
    
    
    <!-- CONTENT -->
    <section id="content">
        <!-- NAVBAR -->
        <nav>
            <i class='bx bx-menu' style="transform: scale(1.5);" ></i>
            <form action="#">
                <div class="form-input">
                    <button type="submit" class="search-btn" disabled style="visibility: hidden;"><i class='bx bx-tool' ></i></button>
                </div>
            </form>
            <input type="checkbox" id="switch-mode" hidden >
            <label for="switch-mode" class="switch-mode"></label>
            <a href="#" class="notification">
                <i class='bx bxs-bell' style="transform: scale(1.5);"></i>
                <span class="num">10</span>
            </a>
            <a href="#" class="profile">
                <img [src]="tokenData.id.photo.url">
            </a>
        </nav>
        <!-- NAVBAR -->
    
        <!-- MAIN -->
        <router-outlet></router-outlet>
        <!-- MAIN -->
    </section>
    </div>
