<!-- MAIN -->
<section id="content">
<main>
    <div class="head-title">
        <div class="left">
            <h1>Dashboard</h1>
            <ul class="breadcrumb">
                <li>
                    <a href="#">Dashboard</a>
                </li>
                <li><i class='bx bx-chevron-right'></i></li>
                <li>
                    <a href="javascript:void(0)">Users</a>
                </li>
                <li><i class='bx bx-chevron-right'></i></li>
                <li>
                    <a class="active" href="javascript:void(0)">Customers</a>
                </li>
            </ul>
        </div>

    </div>

    <ul class="box-info">
        <li>
            <i class='bx bxs-group' ></i>
            <span class="text">
                <h3>{{users.length}}</h3>
                <p>Customers</p>
            </span>
        </li> 
    </ul>

    <div class="table-data">
        <div class="order">
            <div class="head">
                <h3>Customers</h3>
                <i class='bx bx-search'></i>
                <i class='bx bx-filter'></i>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>PP</th>
                        <th>Name</th>
                        <th>CreatedAt</th>
                        <th>Detals</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users; let i = index">
                        <td>
                            <img src="unnamed.jpg">
                        </td>
                        <td>
                            <p>{{ user.firstName }}</p>
                        </td>
                        <td>{{ user.updatedAt }}</td>
                        <td>
                            <div class="dropdown" [ngClass]="{'show': dropdownStates[i]}" (click)="toggleDropdown(i)">
                                <a class="btn btn-secondary dropdown-toggle btn-sm" role="button" id="dropdownMenuLink" aria-haspopup="true" aria-expanded="false" style="background-color: #12181f;">
                                    ...
                                </a>
                                
                                <div class="dropdown-menu dropdown-menu-sm" [ngClass]="{'show': dropdownStates[i]}" aria-labelledby="dropdownMenuLink">
                                    <a class="dropdown-item " href="#"><i class='bx bx-show'></i> Show</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item " href="#"><i class='bx bx-edit'></i> Update</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item " (click)="openConfirmDialog(user._id)"><i class='bx bx-trash'></i> Delete</a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
</main>
</section>
<!-- MAIN -->
