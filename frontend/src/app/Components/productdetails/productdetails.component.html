<app-header></app-header>
<div class="div1">
  <div class="div2">
    <main class="main">
      <!-- Wrapper Section -->
      <section class="section wrapper wrapper-section">
        <div class="container wrapper-column">
          <!-- Loading indicator -->
          <div *ngIf="isLoading" class="center" style="grid-column: span 2; padding: 2rem;">
            <p>Loading product details...</p>
          </div>
          
          <!-- Error message -->
          <div *ngIf="errorMessage" class="center" style="grid-column: span 2; padding: 2rem;">
            <p style="color: red;">{{ errorMessage }}</p>
          </div>
          
          <!-- Product images carousel -->
          <p-carousel *ngIf="!isLoading && product" class="larger-carousel" [value]="images" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="3000"
              [showIndicators]="true">
              <ng-template pTemplate="item" let-image >
                  <div class="wrapper-bgimage">
                      <img [src]="image.src" class="wrapper-image" alt="product">
                  </div>
              </ng-template>
          </p-carousel>
          
          <!-- Product details -->
          <div *ngIf="!isLoading && product" class="wrapper-content">
            <div class="wrapper-inform">
              <span class="badge badge-darken">{{ product.categoryName || 'Product Category' }}</span>
              <h1 class="display-medium font-bold" style="letter-spacing: 2px; font-weight: 750;">
                {{ product.name }}
              </h1>
              <p class="text-base font-normal">
                {{ product.description }}
              </p>
            </div>
            <div class="wrapper-detail">
              <div class="price">
                <span class="text-base font-medium">Price:</span>
                <h3 class="text-large font-semi">${{ product.price }}.00</h3>
              </div>
            </div>
            <div class="wrapper-action">
              <button class="btn btn-darken">Add to Cart</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<app-reviews></app-reviews>
<app-footer></app-footer>
