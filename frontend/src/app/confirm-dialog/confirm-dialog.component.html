<div style="position: fixed; top: 30%; left: 50%; transform: translateX(-50%); z-index: 9999; background-color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); ">
    <h2 mat-dialog-title class="text-center mb-4">Deletion Alert !</h2>
    <mat-dialog-content class="p-4 bg-light rounded">
        <p class="mt-3 mb-3">Are you sure you want to delete this Customer?</p>
    </mat-dialog-content>
    <mat-dialog-actions class="d-flex justify-content-end p-3">
        <button mat-button class="btn btn-secondary" style="margin-right: 20px;" (click)="onClose()">No</button>
        <button mat-button class="btn btn-danger" (click)="onDelete()">Yes</button>
    </mat-dialog-actions>
</div>
