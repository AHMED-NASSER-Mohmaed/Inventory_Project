<h2 mat-dialog-title class="text-center mb-4">Deactivating !</h2>
<mat-dialog-content class="p-4 bg-light rounded">
    <p class="mt-3 mb-3">Are you sure you want to Deactivate This User ?</p>
</mat-dialog-content>
<mat-dialog-actions class="d-flex justify-content-end p-3">
    <button mat-button class="btn btn-secondary" style="margin-right: 20px;" (click)="onClose()">Cancel</button>
    <button mat-button class="btn btn-danger" (click)="onDeactivate()">Deactivate</button>
</mat-dialog-actions>
